name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HACS archive
        run: |
          cd custom_components/kryptex_pool
          zip -r "$GITHUB_WORKSPACE/hacs-kryptex-pool.zip" .
          cd "$GITHUB_WORKSPACE"
          unzip -l hacs-kryptex-pool.zip
          unzip -p hacs-kryptex-pool.zip manifest.json >/dev/null
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" hacs-kryptex-pool.zip --clobber
          else
            gh release create "${{ github.ref_name }}" hacs-kryptex-pool.zip \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
